name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APKTOOL_VERSION: 2.12.1
  KEYSTORE: .github/debug.keystore
  KEYSTORE_PASS: android
  KEY_ALIAS: androiddebugkey

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache apktool
        uses: actions/cache@v4
        with:
          path: ~/.apktool-jar
          key: apktool-${{ env.APKTOOL_VERSION }}

      - name: Fetch apktool
        run: |
          mkdir -p ~/.apktool-jar
          JAR=~/.apktool-jar/apktool_${APKTOOL_VERSION}.jar
          if [ ! -f "$JAR" ]; then
            curl -fsSL -o "$JAR" \
              "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          fi
          echo "APKTOOL_JAR=$JAR" >> "$GITHUB_ENV"

      # ubuntu-latest ships the Android SDK preinstalled — take the newest build-tools from it
      - name: Locate build-tools
        run: |
          BT_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools"
          BT=$(ls -1 "$BT_DIR" | sort -V | tail -1)
          echo "Using build-tools $BT"
          echo "$BT_DIR/$BT" >> "$GITHUB_PATH"

      - name: Read version from apktool.yml
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName:[[:space:]]*//p' apktool.yml | tr -d "'\"" | head -1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode:[[:space:]]*//p' apktool.yml | tr -d "'\"" | head -1)
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "APK_NAME=FreeKate-${VERSION_NAME}-${VERSION_CODE}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # apktool assembles dangling class references without a word — they only blow up at
      # runtime as NoClassDefFoundError. Catch them here instead.
      - name: Check for dangling references
        run: |
          fail=0

          grep -rhoE 'Lcom/perm/[A-Za-z0-9_$/]+;' smali/com/perm/ \
            | sed 's/^L//; s/;$//' | sort -u \
            | while read -r c; do [ -f "smali/$c.smali" ] || echo "$c"; done > dangling.txt
          if [ -s dangling.txt ]; then
            echo "::error::These classes doesn't exist and might crash the app:"
            sed 's/^/  /' dangling.txt
            fail=1
          fi

          rm -f dangling.txt
          [ "$fail" = 0 ] || exit 1
          echo "OK"

      - name: Build with apktool
        run: |
          java -jar "$APKTOOL_JAR" build . -o "dist/${APK_NAME}-unsigned.apk"

      - name: Align
        run: |
          zipalign -p -f 4 "dist/${APK_NAME}-unsigned.apk" "dist/${APK_NAME}-aligned.apk"

      # minSdkVersion is 7, so v1 (JAR) signing is mandatory — v2/v3 alone would not install
      # on anything below Android 7.0
      - name: Sign
        run: |
          apksigner sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:${KEYSTORE_PASS}" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEYSTORE_PASS}" \
            --min-sdk-version 7 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "dist/${APK_NAME}.apk" \
            "dist/${APK_NAME}-aligned.apk"
          apksigner verify --min-sdk-version 7 --verbose "dist/${APK_NAME}.apk"
          rm -f "dist/${APK_NAME}-unsigned.apk" "dist/${APK_NAME}-aligned.apk" "dist/${APK_NAME}.apk.idsig"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APK_NAME }}.apk
          body: |
            Build from `${{ github.sha }}` using apktool ${{ env.APKTOOL_VERSION }}.
